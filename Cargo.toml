[workspace]
members = [
    "crates/serde",
    "crates/crypto",
    "crates/model",
    "crates/store",
    "crates/chain",
    "crates/protocol",
    "crates/conf",
    "crates/flow",
    "crates/api",
    "crates/app",
]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/soulredcat/rustnode"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.alephium-upstream]
repository = "https://github.com/alephium/alephium.git"
commit = "76a71237e295693e760a15f3eb5d6566f2a13d93"

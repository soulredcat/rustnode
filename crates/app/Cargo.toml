[package]
name = "alephium-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "rustnode"
path = "src/main.rs"

[dependencies]
alephium-api = { path = "../api" }
alephium-chain = { path = "../chain" }
alephium-conf = { path = "../conf" }
alephium-flow = { path = "../flow" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

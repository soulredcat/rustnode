name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply safety patch
        if: github.event_name == 'push' && github.ref_name == 'bot-fastpath-rebuild'
        run: python3 scripts/apply-fastpath-safety-fix.py

      - name: Format source
        run: cargo fmt --all

      - name: Regenerate lockfile
        run: cargo generate-lockfile

      - name: Persist safety patch
        if: github.event_name == 'push' && github.ref_name == 'bot-fastpath-rebuild'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates docs
          if ! git diff --cached --quiet; then
            git commit -m "fix: enforce canonical single-transaction correlation"
            git push origin HEAD:bot-fastpath-rebuild
          fi

      - name: Compile
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

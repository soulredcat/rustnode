name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply Clippy correction
        if: github.event_name == 'push' && github.ref_name == 'bot-fastpath-rebuild'
        run: |
          sed -i 's/value.min(DEFAULT_TX_REQUEST_BATCH_SIZE).max(1)/value.clamp(1, DEFAULT_TX_REQUEST_BATCH_SIZE)/' crates/conf/src/lib.rs

      - name: Format source
        run: cargo fmt --all

      - name: Regenerate lockfile
        run: cargo generate-lockfile

      - name: Persist correction
        if: github.event_name == 'push' && github.ref_name == 'bot-fastpath-rebuild'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/conf/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix: use explicit single-item request clamp"
            git push origin HEAD:bot-fastpath-rebuild
          fi

      - name: Compile
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

name: Node task
description: Work toward serving nixiaproject's API surface
title: "[node] "
labels: ["fastpath"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the measured latency, correctness, or reliability problem.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the endpoint from docs/NIXIA_API_SURFACE.md or the roadmap stage, and the P2P, API, state, or VM boundary.
    validations:
      required: true
  - type: textarea
    id: bounds
    attributes:
      label: Bounds and failure modes
      description: Queue limits, timeouts, retries, malformed input, disconnects, and overload behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Tests, official interoperability, or latency distribution required for completion.
    validations:
      required: true

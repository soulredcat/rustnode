# Isolated official Alephium node configuration for Rust interoperability tests.
# This is a local devnet, not mainnet/testnet.

alephium {
  broker {
    groups = 4
    broker-num = 1
    broker-id = 0
  }

  network {
    # interoperability default for this repo:
    # keep P2P/loopback on 127.0.0.1:19985.
    # If Java/Alephium is already using this port, keep Java running and use attach mode
    # (RUST_INTEROP_ATTACH_TO_EXISTING=1) or override OFFICIAL_NODE_P2P_PORT.
    network-id = 2

    bind-address = "127.0.0.1:19985"
    internal-address = "127.0.0.1:19985"
    coordinator-address = "127.0.0.1:19985"
    external-address = null

    rest-port = 12973
    miner-api-port = 10973

    enable-p2p-v2 = true
    ping-frequency = 5 seconds
    retry-timeout = 10 seconds

    upnp.enabled = false
  }

  discovery {
    bootstrap = []
  }

  api {
    network-interface = "127.0.0.1"
    api-key-enabled = false
  }

  wallet.enabled = false
  mempool.auto-mine-for-dev = false
}

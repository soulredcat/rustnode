# What the official node behind rustnode needs for nixiaproject.
#
# Every setting below is false by default in the official node. Merge this
# into the official node's user.conf (in ALEPHIUM_HOME, ~/.alephium by default)
# and restart it. Indexes cover blocks processed while they are on.
#
# Also required: official v4.7.0 or newer, and no `api-key` on the official
# node if nixiaproject's /ws subscriptions are used (its WebSocket client sends
# no key).

alephium {
  network {
    # /ws: block and contract-event subscriptions
    ws.enabled = true
  }

  node {
    event-log {
      # /events/contract/*, contract events on /ws
      enabled = true
      # GET /events/tx-id/{txId}
      index-by-tx-id = true
      # GET /blockflow/blocks-with-events/{hash}
      index-by-block-hash = true
    }

    indexes {
      # GET /transactions/rich-details/{txId}
      tx-output-ref-index = true
      # GET /contracts/{address}/sub-contracts
      subcontract-index = true
    }
  }
}
